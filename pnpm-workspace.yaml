packages:
  - "apps/*"
  - "servers/*"
  - "packages/*"
  - "prebuilt/*"
  - "prebuilt/*/*"

allowBuilds:
  esbuild: true
  unrs-resolver: true

audit:
  level: high

minimumReleaseAgeExclude:
  - source-map-js@1.2.2
  - sharp@0.35.5
  - '@modelcontextprotocol/sdk@1.31.0'

# braces has no patched release on npm (latest is 3.0.3) as of 2026-10-14.
# Reached only through dev tooling (eslint-config-next, shadcn).
# Remove this entry once braces >= 3.0.4 is published.
auditConfig:
  ignoreGhsas:
    - GHSA-vfj7-8cjw-p6xm
